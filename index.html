<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quantifiers: drag and drop</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--border:#cfd5e3;--accent:#3b5bdb;--accent-t:#fff;--tile:#eef2ff;--tile-b:#b6c3f5;--zone:#f9fafd;--ok:#1b7a43;--okbg:#dff5e8;--bad:#b42318;--badbg:#fde4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--text:#e8ebf3;--muted:#a1a9ba;--border:#37405a;--accent:#7c9bff;--accent-t:#10151f;--tile:#27304a;--tile-b:#4a5a8f;--zone:#161a24;--ok:#7fe0a5;--okbg:#17382a;--bad:#ff9a8f;--badbg:#44211e}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--text:#e8ebf3;--muted:#a1a9ba;--border:#37405a;--accent:#7c9bff;--accent-t:#10151f;--tile:#27304a;--tile-b:#4a5a8f;--zone:#161a24;--ok:#7fe0a5;--okbg:#17382a;--bad:#ff9a8f;--badbg:#44211e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:0 0 6px}
h2{font-size:1.2rem;margin:0 0 10px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px 16px;margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;min-height:56px;border-radius:10px;background:var(--zone);border:2px solid var(--border);margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bank:empty::before{content:"All words placed";color:var(--muted);font-size:.92rem;align-self:center}
.bank.over{border-color:var(--accent)}
ol{margin:0;padding-left:26px}
li{line-height:2.5;margin-bottom:2px}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:120px;min-height:40px;box-sizing:border-box;vertical-align:middle;margin:2px 4px;padding:2px;border:2px dashed var(--border);border-radius:8px;background:var(--zone)}
.slot.over{border-color:var(--accent);border-style:solid}
.slot.ok{border:2px solid var(--ok)}
.slot.bad{border:2px solid var(--bad)}
.tile{display:inline-block;padding:6px 12px;border-radius:8px;background:var(--tile);border:1px solid var(--tile-b);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;color:var(--text);line-height:1.4}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.slot.ok .tile{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.slot.bad .tile{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.tile.ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:grabbing}
.tile.lift{opacity:.3}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-t);cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
.msg{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Quantifiers: complete the sentences</h1>
<p class="sub">Drag each word from the word bank into the gap where it fits. Every word is used once. On a phone you can also tap a word and then tap a gap, and tap a placed word to send it back. Press Check answers at the end of each set.</p>
<div id="app"></div>
</main>
<script>
const D=[
{n:"Set 1",w:["neither","each","the whole","a couple of","countless","none of","upwards of","heaps of"],q:[
["___ of the two candidates had the experience we were looking for, so we advertised the job again.","neither"],
["There were ___ stars in the sky, and it was impossible to count them.","countless"],
["___ my friends could come to the party. They were all away on holiday.","none of"],
["___ student in the class has to give a short presentation.","each"],
["He ate ___ cake by himself and then felt ill.","the whole"],
["Can you lend me ___ euros until tomorrow? I only need to buy a sandwich.","a couple of"],
["The final was watched by ___ 30,000 fans at the stadium.","upwards of"],
["I can't go out tonight. I've got ___ homework to do.","heaps of"]]},
{n:"Set 2",w:["all the","bags of","both","every","several","countless","upwards of","none of"],q:[
["This flat is perfect for a family. It has ___ storage space, and the garden is huge.","bags of"],
["___ my grandmothers lived to be over ninety.","both"],
["She calls her mother ___ single day, without fail.","every"],
["I've been to Rome ___ times, at least five or six, so I know the main sights quite well.","several"],
["There were ___ stars in the desert sky. It was impossible to count them.","countless"],
["The new stadium will hold ___ 60,000 spectators.","upwards of"],
["___ the 200 emails I received yesterday were important, so I deleted them all.","none of"],
["I've read ___ books on this shelf, so I need to buy some new ones.","all the"]]},
{n:"Set 3",w:["a great deal of","tons of","both","every","neither","none of","the whole","upwards of"],q:[
["The job requires ___ patience as well as excellent communication skills.","a great deal of"],
["I've got ___ emails to answer before I can go home.","tons of"],
["___ of the twins likes broccoli, so we never cook it.","neither"],
["___ of the thirty guests I invited could come, so we cancelled the dinner.","none of"],
["___ child taking the exam must bring an ID card.","every"],
["He drank ___ bottle of wine on his own and then fell asleep on the sofa.","the whole"],
["___ my sisters are older than me, so I'm the youngest in the family.","both"],
["The conference was attended by ___ 2,000 delegates from forty countries.","upwards of"]]}];
const app=document.getElementById("app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=s=>({order:shuffle(s.w),slots:Array(s.q.length).fill(null),res:null,msg:""});
const st=D.map(fresh);
let sel=null,d=null;
app.innerHTML=D.map((s,i)=>`<section class="card" data-s="${i}"><h2>${s.n}</h2><div class="bank"></div><ol>${s.q.map((q,k)=>{const p=q[0].split("___");return `<li>${p[0]}<span class="slot" data-k="${k}"></span>${p[1]}</li>`}).join("")}</ol><div class="row"><button data-a="check">Check answers</button><button class="sec" data-a="reset">Reset</button><span class="msg" role="status"></span></div></section>`).join("");
function draw(i){const c=st[i],sc=app.children[i];
 const tile=w=>`<span class="tile${sel&&sel.s===i&&sel.w===w?" sel":""}" data-w="${w}">${w}</span>`;
 sc.querySelector(".bank").innerHTML=c.order.filter(w=>!c.slots.includes(w)).map(tile).join("");
 sc.querySelectorAll(".slot").forEach((el,k)=>{const w=c.slots[k];el.innerHTML=w?tile(w):"";el.className="slot"+(c.res?" "+c.res[k]:"")});
 sc.querySelector(".msg").textContent=c.msg}
D.forEach((_,i)=>draw(i));
function place(i,w,src,k){const c=st[i],prev=c.slots[k];c.slots[k]=w;if(src>=0)c.slots[src]=prev;c.res=null;c.msg=""}
app.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.closest(".card").dataset.s,c=st[i];
 if(b.dataset.a==="reset"){st[i]=fresh(D[i]);if(sel&&sel.s===i)sel=null;return draw(i)}
 if(c.slots.includes(null)){c.res=null;c.msg="Fill every gap first."}
 else{c.res=c.slots.map((w,k)=>w===D[i].q[k][1]?"ok":"bad");const n=c.res.filter(x=>x==="ok").length;c.msg=`You got ${n} / ${c.slots.length} correct.`+(n<c.slots.length?" Red gaps are wrong: move the words and check again.":" Well done!")}
 draw(i)});
app.addEventListener("pointerdown",e=>{if(d||e.button>0)return;const sc=e.target.closest(".card");if(!sc)return;const i=+sc.dataset.s,t=e.target.closest(".tile");
 if(t){e.preventDefault();const sl=t.closest(".slot");d={t,i,w:t.dataset.w,src:sl?+sl.dataset.k:-1,x:e.clientX,y:e.clientY,on:false,g:null};return}
 const sl=e.target.closest(".slot");
 if(sl&&sel&&sel.s===i){place(i,sel.w,-1,+sl.dataset.k);sel=null;draw(i)}});
function zoneAt(e){const el=document.elementFromPoint(e.clientX,e.clientY),z=el&&el.closest(".slot,.bank");return z&&z.closest(".card").dataset.s==d.i?z:null}
addEventListener("pointermove",e=>{if(!d)return;
 if(!d.on){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<6)return;d.on=true;d.g=d.t.cloneNode(true);d.g.classList.add("ghost");document.body.appendChild(d.g);d.t.classList.add("lift")}
 d.g.style.left=e.clientX-d.g.offsetWidth/2+"px";d.g.style.top=e.clientY-d.g.offsetHeight/2+"px";
 document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));const z=zoneAt(e);if(z)z.classList.add("over")});
addEventListener("pointerup",e=>{if(!d)return;const {i,w,src}=d,c=st[i],old=sel;
 if(!d.on){if(src>=0){c.slots[src]=null;c.res=null;c.msg="";sel=null}else sel=(sel&&sel.s===i&&sel.w===w)?null:{s:i,w}}
 else{const z=zoneAt(e);d.g.remove();document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
  if(z){if(z.classList.contains("slot"))place(i,w,src,+z.dataset.k);else if(src>=0){c.slots[src]=null;c.res=null;c.msg=""}sel=null}}
 d=null;draw(i);if(old&&old.s!==i)draw(old.s)});
addEventListener("pointercancel",()=>{if(!d)return;if(d.g)d.g.remove();const i=d.i;d=null;draw(i)});
</script>
</body>
</html>
